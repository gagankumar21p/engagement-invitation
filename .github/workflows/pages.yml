name: Deploy invitation to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Assemble the site and set the real public URL
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html css js assets _site/
          touch _site/.nojekyll
          SITE_URL="${BASE_URL%/}/"
          # Replace the placeholder URL used for the canonical link, Open Graph and Twitter tags.
          sed -i "s|https://YOUR-USERNAME.github.io/engagement-invitation/|${SITE_URL}|g" _site/index.html
          echo "Public URL set to ${SITE_URL}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
